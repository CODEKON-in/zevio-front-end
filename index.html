<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffc107" />
    <meta name="description" content="Zevio — order from hotels and bakeries between Papanasam and Ayyampettai, delivered home." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fredoka for the brand voice, Inter for everything that must stay legible
      small. Both swap, so the system font shows instantly and is replaced when
      they arrive — the first paint never waits on a font.
      TODO before launch: self-host both as a fallback for when Google Fonts is
      unreachable (blocked networks, captive portals), rather than depending on it.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" />
    </noscript>
    <title>Zevio</title>
    <style>
      /* Everything here is plain HTML and CSS so the splash paints while the
         JavaScript is still downloading — on a slow village connection that is
         the difference between "loading" and "broken". */
      html, body { margin: 0; background: #ffffff; }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        color: #2b2416;
        font-family: 'Fredoka', 'Segoe UI', system-ui, sans-serif;
        /* Only opacity animates on the way out: no layout, no repaint storm. */
        opacity: 1;
        transition: opacity 200ms ease;
      }
      #boot.boot-hide { opacity: 0; pointer-events: none; }

      .boot-logo {
        width: 88px; height: 88px;
        border-radius: 28px;
        background: #ffc107;
        display: grid; place-items: center;
        box-shadow: 0 8px 24px rgba(61, 43, 0, 0.16);
      }
      .boot-name { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 0.01em; }
      .boot-dots { display: flex; gap: 8px; }
      .boot-dots i {
        width: 10px; height: 10px; border-radius: 50%;
        background: #ffc107; display: block;
      }

      /* Three dots, staggered — transform and opacity only, which the GPU can
         do without touching layout. Cheap enough for a budget phone. */
      @media (prefers-reduced-motion: no-preference) {
        .boot-dots i { animation: boot-bounce 1.1s ease-in-out infinite; }
        .boot-dots i:nth-child(2) { animation-delay: 0.15s; }
        .boot-dots i:nth-child(3) { animation-delay: 0.3s; }
        @keyframes boot-bounce {
          0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
          40%           { transform: translateY(-9px); opacity: 1; }
        }
      }
      /* Motion turned off at the OS level: the dots simply sit there, still visible. */
      @media (prefers-reduced-motion: reduce) {
        .boot-dots i { opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite" aria-label="Loading Zevio">
      <div class="boot-logo" aria-hidden="true">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3d2b00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 4.5 4h15L21 9" /><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0" /><path d="M5 11.5V20h14v-8.5" /><path d="M10 20v-5h4v5" /></svg>
      </div>
      <p class="boot-name">Zevio</p>
      <div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 24px; text-align: center">
        Please turn on JavaScript to use Zevio.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
