<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b3cc4" />
    <meta name="description" content="Zevio — order from hotels and bakeries between Papanasam and Ayyampettai, delivered home." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font loads without blocking the first paint; system font shows until it arrives. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
    </noscript>
    <title>Zevio</title>
    <style>
      /* Paint the page background before the CSS file arrives (no white flash). */
      html, body { margin: 0; background: #f4f4f6; }
      /* Instant loading screen shown by the HTML itself while JavaScript downloads
         on slow networks. React replaces it as soon as the app starts. */
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        background: #5b3cc4; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .boot-logo { width: 84px; height: 84px; border-radius: 24px; background: rgba(255,255,255,.16); display: grid; place-items: center; }
      .boot-name { font-size: 28px; font-weight: 700; margin: 0; }
      .boot-bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; margin-top: 12px; }
      .boot-bar::after { content: ''; display: block; width: 40%; height: 100%; background: #fff; border-radius: 4px; animation: boot 1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading">
        <div class="boot-logo" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 4.5 4h15L21 9" /><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0" /><path d="M5 11.5V20h14v-8.5" /><path d="M10 20v-5h4v5" /></svg>
        </div>
        <p class="boot-name">Zevio</p>
        <div class="boot-bar"></div>
      </div>
    </div>
    <noscript>
      <p style="font-family: sans-serif; padding: 24px; text-align: center">
        Please turn on JavaScript to use Zevio.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
